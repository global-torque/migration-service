name: migration_service_test

networks:
  app-datastore:
    driver: bridge

volumes:
  gomodcache:
  gocache:

services:
  db:
    image: postgres:16-alpine
    container_name: migration_service_test_db
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15433:5432"
    networks:
      - app-datastore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  tests:
    image: cr.webdevelop.pro/webdevelop-pro/go-common:latest-dev
    container_name: migration_service_test_runner
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-datastore
    environment:
      ENV_FILE: /workspace/etc/.env.test
      DB_TYPE: postgres
      DB_DATABASE: test_db
      DB_USER: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      DB_MIN_CONNECTIONS: "1"
      DB_MAX_CONNECTIONS: "5"
      DB_MAX_RETRIES: "30"
      DB_LOG_LEVEL: error
      DB_APP_NAME: migration_worker
      ENV_NAME: dev
      HOST: 0.0.0.0
      PORT: "8085"
      CORS_ALLOWED_ORIGINS: http://localhost:8085
      MIGRATION_DIR: ./tests/migrations/TestErrorCode
      LOG_CONSOLE: "true"
      LOG_LEVEL: debug
      GOMODCACHE: /usr/local/go/pkg/mod
      GOCACHE: /usr/local/go/build-cache
      GOPATH: /usr/local/go
    volumes:
      - .:/workspace
      - ../go-common:/go-common:ro
      - ./etc/.env.test:/workspace/.example.env:ro
      - gomodcache:/usr/local/go/pkg/mod
      - gocache:/usr/local/go/build-cache
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        set -e
        go test -count=1 -p 1 -v ./...

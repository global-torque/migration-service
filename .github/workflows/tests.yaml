name: tests

on:
  pull_request:
  push:
    branches:
      - master
      - dev

env:
  GO_COMMON_REF: 11c07060d778efcb26834b1c932fd46ce864f4a4

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_TYPE: postgres
      DB_DATABASE: test_db
      DB_USER: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      DB_MIN_CONNECTIONS: "1"
      DB_MAX_CONNECTIONS: "5"
      DB_MAX_RETRIES: "30"
      DB_LOG_LEVEL: error
      DB_APP_NAME: migration_worker
      ENV_NAME: dev
      HOST: 0.0.0.0
      PORT: "8085"
      CORS_ALLOWED_ORIGINS: http://localhost:8085
      MIGRATION_DIR: ./tests/migrations/TestErrorCode
      LOG_CONSOLE: "true"
      LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: webdevelop-pro/go-common
          ref: ${{ env.GO_COMMON_REF }}
          path: go-common
          token: ${{ secrets.GO_COMMON_TOKEN || github.token }}
      - run: ln -sfn "$PWD/go-common" ../go-common
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -count=1 -p 1 -v ./...
      - run: go vet ./...
      - run: go test -race -short ./...

name: Publish tagged release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: migration-service-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run unit tests
        run: go test ./... -run Unit -count=1

      - name: Run vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
        goarch:
          - "386"
          - amd64
          - arm64
        exclude:
          - goos: darwin
            goarch: "386"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build release archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          archive="app-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}.tar.gz"
          mkdir -p build dist
          go build -o build/app ./cmd/server
          test "$(go env CGO_ENABLED)" = "0"
          if [ "$GOOS" = "linux" ]; then
            file build/app | tee /tmp/migration-service-file-output
            grep -q "statically linked" /tmp/migration-service-file-output
          fi
          tar -C build -czf "dist/${archive}" app
          md5sum "dist/${archive}" | awk '{print $1}' > "dist/${archive}.md5"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify release files
        run: |
          set -euo pipefail
          archive_count=$(find dist -maxdepth 1 -type f -name 'app-*.tar.gz' | wc -l | tr -d '[:space:]')
          checksum_count=$(find dist -maxdepth 1 -type f -name 'app-*.tar.gz.md5' | wc -l | tr -d '[:space:]')
          test "${archive_count}" = "5"
          test "${checksum_count}" = "5"
          for archive in dist/app-*.tar.gz; do
            expected=$(tr -d '[:space:]' < "${archive}.md5")
            actual=$(md5sum "${archive}" | awk '{print $1}')
            test "${actual}" = "${expected}"
          done

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes "Automated migration-service release."
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
